name: Asian breakout walk-forward

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run fixed-profile walk-forward diagnostic
        run: python breakout_walkforward.py
      - uses: actions/upload-artifact@v4
        with:
          name: asian-breakout-walkforward
          path: reports/asian_breakout_walkforward.json
