name: Asian breakout paper monitor

on:
  workflow_dispatch:
  schedule:
    # Run every five minutes from 07:00-09:55 UTC on weekdays.
    # This fully covers 08:00-10:00 Europe/London in both BST and GMT;
    # the strategy's timezone-aware gate ignores calls outside the local window.
    - cron: "*/5 7-9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: asian-breakout-paper
  cancel-in-progress: false

jobs:
  paper-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run active paper breakout monitor
        run: python breakout_runner.py
      - name: Run prospective control vs challenger comparison
        run: python breakout_compare_runner.py
      - name: Assess MNQ and NNQ execution feasibility
        run: python breakout_execution.py
      - name: Evaluate prospective validation gate
        run: python breakout_validation.py
      - name: Persist paper journals and latest reports
        run: |
          if git status --porcelain -- state reports | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- state reports
            if git diff --cached --quiet; then
              echo "No paper-state changes to commit."
            else
              git commit -m "Update Asian breakout paper journals"
              git push origin HEAD:main
            fi
          fi
