name: Asian breakout backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/backtest-trigger.txt"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: python breakout_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: asian-breakout-backtest
          path: reports/asian_breakout_backtest.json
