name: TradingView parity reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/tradingview-reference-trigger.txt"

permissions:
  contents: read

jobs:
  export-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export Python reference signals
        run: python breakout_tradingview_reference.py --period 60d
      - uses: actions/upload-artifact@v4
        with:
          name: tradingview-parity-reference
          path: |
            reports/tradingview_parity_reference.csv
            reports/tradingview_parity_reference.json
