name: Daily Nasdaq-100 swing screen

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"
      timezone: "Europe/Copenhagen"

permissions:
  contents: write

concurrency:
  group: nasdaq100-daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run screening
        run: python swing_agent.py

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: nasdaq100-swing-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: error

      - name: Save report history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add daily swing screening report"
            git push
          fi
