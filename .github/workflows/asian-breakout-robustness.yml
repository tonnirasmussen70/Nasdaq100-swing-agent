name: Asian breakout robustness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/robustness-trigger.txt"

permissions:
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run robustness sweep
        run: python breakout_robustness.py
      - uses: actions/upload-artifact@v4
        with:
          name: asian-breakout-robustness
          path: reports/asian_breakout_robustness.json
