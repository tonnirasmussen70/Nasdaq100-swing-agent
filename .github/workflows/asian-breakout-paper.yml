name: Asian breakout paper monitor

on:
  workflow_dispatch:
  schedule:
    # 07:55-09:55 UTC covers the London 08:00-10:00 window in winter.
    # During UK daylight saving the runner's DST-aware gate accepts 08:00-10:00
    # London and harmlessly rejects calls outside that window.
    - cron: "55,0,5,10,15,20,25,30,35,40,45,50 7-9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: asian-breakout-paper
  cancel-in-progress: false

jobs:
  paper-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/asian-breakout-paper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run paper breakout monitor
        run: python breakout_runner.py
      - name: Persist paper journal and latest report
        run: |
          if git status --porcelain state/asian_breakout_journal.json reports/asian_breakout_latest.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/asian_breakout_journal.json reports/asian_breakout_latest.json
            git commit -m "Update Asian breakout paper journal"
            git push origin HEAD:feature/asian-breakout-paper
          fi
