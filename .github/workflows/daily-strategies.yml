name: Daily pullback and breakout scan
on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * 1-5"
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python daily_strategies.py
      - name: Commit latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily_strategies_latest.json
          git diff --cached --quiet || git commit -m "data: daily pullback and breakout scan"
          git push
