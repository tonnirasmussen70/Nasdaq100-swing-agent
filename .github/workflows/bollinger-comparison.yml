name: Bollinger comparison
on:
  pull_request:
    paths:
      - 'bollinger*.py'
      - 'daily_strategies.py'
      - 'tests/test_bollinger.py'
      - '.github/workflows/bollinger-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Historical A B C comparison
        run: python bollinger_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bollinger-comparison
          path: |
            reports/bollinger_comparison
            work/bollinger_prices
