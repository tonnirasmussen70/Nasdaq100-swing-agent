name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q swing_agent.py asian_breakout.py breakout_runner.py breakout_backtest.py breakout_robustness.py breakout_compare_runner.py breakout_walkforward.py breakout_validation.py app.py
      - run: pytest -q
